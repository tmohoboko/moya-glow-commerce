name: L Beauty QA
on:
  push:
    branches: [main, 'feat/hosted-login-stripe', 'feat/booking-workflow']
  pull_request:
    branches: [main, 'feat/hosted-login-stripe']
  workflow_dispatch:
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  hosted:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'feat/hosted-login-stripe')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test -- tests/hosted-live.spec.js tests/smoke.spec.js tests/release.spec.js --timeout=120000
        env:
          BASE_URL: https://moya-glow-commerce.vercel.app
          QA_RESULTS_PATH: qa/hosted-results.json
          QA_SCREENSHOT_DIR: qa/hosted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-qa-${{ github.sha }}
          path: |
            qa/hosted-results.json
            qa/hosted/
            test-results/
  regression:
    env:
      DATABASE_URL: sqlite:////tmp/lbeauty-browser-qa.sqlite3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - run: node scripts/sync-catalogue.mjs --check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python scripts/seed-booking-qa.py
      - run: uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/lbeauty-api.log 2>&1 &
      - run: npm test
        env:
          QA_RESULTS_PATH: qa/ci-results.json
          QA_SCREENSHOT_DIR: qa/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-qa-${{ github.sha }}
          path: |
            qa/ci-results.json
            qa/ci/
            test-results/
            /tmp/lbeauty-api.log
          if-no-files-found: ignore
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lbeauty
          POSTGRES_PASSWORD: ci-only-local-password
          POSTGRES_DB: lbeauty_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://lbeauty:ci-only-local-password@127.0.0.1:5432/lbeauty_test
