name: Enterprise prototype checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt
      - run: npm run lint && npm run test:unit && npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm test
      - run: VITE_CATALOG_API=true npm run build && npm run test:enterprise
      - run: python scripts/secret-scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence
          path: |
            qa/smoke-results.json
            qa/enterprise-results.json
            test-results/
